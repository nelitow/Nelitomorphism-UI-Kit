<!-- @dsCard group="Spacing" viewport="700x140" subtitle="4px grid · compact controls · tight radii" name="Spacing & radii" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;background:var(--bg-0)">
<div style="display:flex;align-items:flex-end;gap:8px">
<div style="width:var(--sp-1);height:var(--sp-1);background:var(--accent)"></div>
<div style="width:var(--sp-2);height:var(--sp-2);background:var(--accent)"></div>
<div style="width:var(--sp-3);height:var(--sp-3);background:var(--accent)"></div>
<div style="width:var(--sp-4);height:var(--sp-4);background:var(--accent)"></div>
<div style="width:var(--sp-6);height:var(--sp-6);background:var(--accent)"></div>
<div style="width:var(--sp-8);height:var(--sp-8);background:var(--accent)"></div>
<span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-left:6px">4 8 12 16 24 32</span>
</div>
<div style="display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">
<div style="width:52px;height:52px;border:1px solid var(--edge-2);border-radius:var(--r-1)"></div>
<div style="width:52px;height:52px;border:1px solid var(--edge-2);border-radius:var(--r-2)"></div>
<div style="width:52px;height:52px;border:1px solid var(--edge-2);border-radius:var(--r-3)"></div>
<div style="width:52px;height:28px;border:1px solid var(--edge-2);border-radius:var(--r-pill)"></div>
<span>6 · 10 · 14 · pill</span>
</div>
</body></html>
