<!-- @dsCard group="Colors" viewport="700x120" subtitle="Status colors — each with a 14%-alpha dim wash" name="Status" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px;background:var(--bg-0);font-family:var(--font-mono);font-size:11px">
<div style="border-radius:var(--r-2);background:var(--ok-dim);border:1px solid var(--ok);color:var(--ok);padding:10px">--ok<br>operational</div>
<div style="border-radius:var(--r-2);background:var(--warn-dim);border:1px solid var(--warn);color:var(--warn);padding:10px">--warn<br>degraded</div>
<div style="border-radius:var(--r-2);background:var(--danger-dim);border:1px solid var(--danger);color:var(--danger);padding:10px">--danger<br>failed</div>
</body></html>
