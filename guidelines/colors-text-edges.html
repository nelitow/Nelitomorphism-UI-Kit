<!-- @dsCard group="Colors" viewport="700x120" subtitle="Text steps + hairline edges" name="Text & edges" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;background:var(--bg-0)">
<div style="display:grid;gap:4px;font-size:var(--text-sm)">
<span style="color:var(--fg-1)">--fg-1 · Primary text</span>
<span style="color:var(--fg-2)">--fg-2 · Secondary text</span>
<span style="color:var(--fg-3)">--fg-3 · Faint / metadata</span>
</div>
<div style="display:grid;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">
<div style="border:1px solid var(--edge-1);border-radius:var(--r-1);padding:6px 10px">--edge-1 · resting border</div>
<div style="border:1px solid var(--edge-2);border-radius:var(--r-1);padding:6px 10px">--edge-2 · hover border</div>
<div style="border:1px solid var(--edge-focus);border-radius:var(--r-1);padding:6px 10px;box-shadow:var(--focus-ring)">--edge-focus · focus ring</div>
</div>
</body></html>
