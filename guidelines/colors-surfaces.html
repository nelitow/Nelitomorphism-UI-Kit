<!-- @dsCard group="Colors" viewport="700x150" subtitle="Elevation — 4 cool near-black surface steps" name="Surfaces" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"></head>
<body style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:16px;background:var(--bg-0)">
<div style="height:110px;border-radius:var(--r-2);border:1px solid var(--edge-1);background:var(--bg-0);padding:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">--bg-0<br>page</div>
<div style="height:110px;border-radius:var(--r-2);border:1px solid var(--edge-1);background:var(--bg-1);padding:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">--bg-1<br>panel</div>
<div style="height:110px;border-radius:var(--r-2);border:1px solid var(--edge-1);background:var(--bg-2);padding:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg-2)">--bg-2<br>card</div>
<div style="height:110px;border-radius:var(--r-2);border:1px solid var(--edge-2);background:var(--bg-3);padding:10px;font-family:var(--font-mono);font-size:11px;color:var(--fg-2)">--bg-3<br>overlay</div>
</body></html>
