<!-- @dsCard group="Components" viewport="700x560" subtitle="Input · Select · Checkbox · Switch · Slider · DatePicker · FileUpload" name="Forms" -->
<!DOCTYPE html><html><head>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="../../neli-loader.js"></script>
</head><body style="background:var(--bg-0);margin:0;padding:16px">
<div id="root"></div>
<script type="text/babel">
const NS = (()=>{for(const k of Object.getOwnPropertyNames(window)){try{const v=window[k];if(v&&typeof v==='object'&&typeof v.Input==='function'&&typeof v.Slider==='function')return v;}catch(e){}}return window;})();
const {Input, Select, Checkbox, Switch, Slider, DatePicker, FileUpload} = NS;
function Demo(){
  const [region, setRegion] = React.useState('us-east');
  const [trace, setTrace] = React.useState(true);
  const [auto, setAuto] = React.useState(true);
  const [timeout_, setTimeout_] = React.useState(1200);
  const [date, setDate] = React.useState(new Date(2026, 6, 27));
  return <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'16px 20px', alignItems:'start'}}>
    <Input label="API key" mono placeholder="sk-…" hint="Scoped to this project"/>
    <Select label="Region" options={["us-east","eu-west","ap-south"]} value={region} onChange={setRegion}/>
    <Input label="Email" defaultValue="ops@acme.dev" error="Address already in use"/>
    <DatePicker label="Expires" value={date} onChange={setDate}/>
    <div style={{display:'grid', gap:12}}>
      <Checkbox label="Enable tracing" checked={trace} onChange={setTrace}/>
      <Checkbox label="Verbose logs" checked={false} onChange={()=>{}}/>
      <Switch label="Auto-deploy" checked={auto} onChange={setAuto}/>
      <Switch label="Maintenance mode" checked={false} onChange={()=>{}}/>
    </div>
    <Slider label="Timeout" min={0} max={5000} step={100} value={timeout_} onChange={setTimeout_} unit="ms"/>
    <FileUpload label="Drop CSV exports" style={{gridColumn:'1 / -1'}}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
